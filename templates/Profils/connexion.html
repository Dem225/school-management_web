{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
     <link rel="stylesheet" href="{% static "Accueil/css/style2.css" %}">
   
</head>
<body>

    <form method="post" action="{% url 'connexion' %}">
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
        {% csrf_token %}
        <h1>Connexion</h1>
        {{ forms.as_p }}
        <button type="submit">SE CONNECTER</button>
    </form>

</body>
</html>
